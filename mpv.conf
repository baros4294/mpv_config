# mpv configuration for Windows 11 / Intel Iris Xe / 8-bit SDR display
# Quality-first profile with one general-purpose upscale shader.

######## Renderer ########

profile=high-quality
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11

fullscreen=yes
autofit-larger=95%x95%
force-window=immediate
border=no

fbo-format=rgba16f
d3d11-output-format=rgba8
d3d11-output-csp=srgb

dither-depth=8
dither=fruit
temporal-dither=no

icc-profile-auto=yes
target-colorspace-hint=yes

######## Hardware decoding ########

hwdec=d3d11va
d3d11va-zero-copy=no

######## Scaling ########

scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

scale-antiring=0.6
cscale-antiring=0.6
dscale-antiring=0.0

correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

glsl-shaders=~~/shaders/FSRCNNX_x2_16-0-4-1.glsl

######## HDR to SDR ########

tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
hdr-compute-peak=auto

######## Debanding ########

deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=4

######## Timing ########

video-sync=display-resample
interpolation=yes
tscale=oversample
framedrop=vo

######## Subtitles ########

sub-ass-override=no
embeddedfonts=yes
sub-auto=fuzzy

slang=eng,en
alang=jpn,ja,eng,en

blend-subtitles=no

######## Audio ########

ao=wasapi
audio-exclusive=no
volume-max=100
audio-pitch-correction=yes

######## Playlist behavior ########

autocreate-playlist=filter
directory-filter-types=video

######## Privacy / session state ########

save-position-on-quit=no
resume-playback=no
save-watch-history=no

######## Cache ########

cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=20

######## Interface ########

osc=no
osd-bar=no
osd-duration=1200
osd-font-size=24

######## Screenshots ########

screenshot-directory=~~/screenshots
screenshot-format=png
screenshot-png-compression=1
screenshot-template=%F-%P