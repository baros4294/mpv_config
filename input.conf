# mpv input bindings for uosc, diagnostics, and quality toggles.

######## Playback ########

SPACE cycle pause; script-binding uosc/flash-pause-indicator
p     cycle pause; script-binding uosc/flash-pause-indicator

RIGHT       seek  5;  script-binding uosc/flash-timeline
LEFT        seek -5;  script-binding uosc/flash-timeline
Shift+RIGHT seek  30; script-binding uosc/flash-timeline
Shift+LEFT  seek -30; script-binding uosc/flash-timeline

UP   add volume  5; script-binding uosc/flash-volume
DOWN add volume -5; script-binding uosc/flash-volume
m    cycle mute; script-binding uosc/flash-volume

[ add speed -0.05; script-binding uosc/flash-speed
] add speed  0.05; script-binding uosc/flash-speed
\ set speed 1.0; script-binding uosc/flash-speed

f   cycle fullscreen
ESC set fullscreen no

q quit
Q quit

######## uosc ########

MBTN_RIGHT script-binding uosc/menu
TAB        script-binding uosc/toggle-ui

Ctrl+o script-binding uosc/open-file
Ctrl+p script-binding uosc/items
Ctrl+s script-binding uosc/subtitles
Ctrl+a script-binding uosc/audio
Ctrl+c script-binding uosc/chapters

> script-binding uosc/next
< script-binding uosc/prev

######## Diagnostics ########

i script-binding stats/display-stats-toggle
I script-binding stats/display-stats
` script-binding console/enable

######## Quality toggles ########

Ctrl+h cycle-values hwdec d3d11va no; show-text "Hardware decoding: ${hwdec}"
Alt+d  cycle deband; show-text "Debanding: ${deband}"
Alt+i  cycle interpolation; show-text "Interpolation: ${interpolation}"

Ctrl+0 set glsl-shaders ""; show-text "Shader: off"
Ctrl+1 set glsl-shaders "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"; show-text "Shader: FSRCNNX"

######## Screenshots ########

s screenshot
S screenshot video