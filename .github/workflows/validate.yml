name: Validate

# Checks that input.conf and script-opts still match the bundled scripts, and that every Lua file compiles.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check config against scripts
        run: python3 .github/scripts/check.py

      # mpv runs scripts on LuaJIT, so compile with it.
      - name: Compile Lua
        run: |
          sudo apt-get install -y --no-install-recommends luajit > /dev/null
          find scripts -name '*.lua' -print0 | xargs -0 -n1 sh -c 'luajit -b "$0" /dev/null || exit 255'

  # The weekly "Update upstream scripts" pull request starts this workflow by hand (pull requests opened with
  # the Actions token start no checks on their own). It merges only a uosc minor or patch release whose
  # bundled ziggy binaries are byte-for-byte unchanged. Anything else waits for a person to read the diff:
  # a thumbfast change (it tracks a moving branch), any change to an executable, any file outside uosc,
  # or a new uosc major version. Checks prove the config still fits; they can't prove upstream code is benign.
  merge-upstream-update:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/upstream-update'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge a uosc-only minor or patch update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          version() {
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/scripts/uosc/main.lua?ref=$1" |
              sed -n "s/^local uosc_version = '\(.*\)'/\1/p"
          }
          old=$(version "$BASE"); new=$(version "$TESTED_SHA")
          [[ -n "$old" && -n "$new" ]] || { echo "Couldn't read the uosc versions; leaving it for a person."; exit 0; }
          if [[ "${old%%.*}" != "${new%%.*}" ]]; then echo "uosc $old -> $new is a major update; leaving it for a person."; exit 0; fi
          changed=$(gh api --paginate "repos/$REPO/compare/$BASE...$TESTED_SHA" --jq '.files[].filename')
          [[ -n "$changed" ]] || { echo "No changed files found; leaving it for a person."; exit 0; }
          held=$(grep -vE '^(scripts/uosc/|fonts/uosc_)' <<<"$changed" || true)
          held+=$'\n'$(grep -E '^scripts/uosc/bin/' <<<"$changed" || true)
          if [[ -n "${held//$'\n'/}" ]]; then
            echo "These files need a person to review them, so the pull request stays open:"
            sed '/^$/d' <<<"$held"
            exit 0
          fi
          gh pr merge automation/upstream-update --repo "$REPO" --squash --match-head-commit "$TESTED_SHA"
